name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Run Tests
        run: cargo test

      - name: Upload Artifact
        # v4 declares node20, which the runners now force onto node24 and warn about.
        # v5 does NOT fix it — it only added preliminary node24 support and still
        # defaulted to node20. v6 was the first to default to node24; v7 is current
        # and changes nothing for a plain name+path upload (its direct-upload mode
        # is opt-in via `archive: false`).
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu
          path: target/release/*
