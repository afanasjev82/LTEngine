[package]
name = "ltengine"
version = "0.2.1"
edition = "2024"

[dependencies]
actix-web = "4"
clap = { version = "4.5.37", features = ["derive", "env"] }
once_cell = "1.21.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
actix-web-static-files = "4.1.1"
static-files = "0.2.5"
hf-hub = { version = "0.5.0" }
anyhow = "1.0.97"
thiserror = { workspace = true }
parking_lot = "0.12"
llama-cpp-2 = "0.1.154"
encoding_rs = "0.8.35"
actix-multipart = "0.7.2"
whatlang = "0.18.0"
[features]
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]
vulkan = ["llama-cpp-2/vulkan"]

[build-dependencies]
static-files = "0.2.5"
time = { version = "0.3", features = ["formatting"] }
