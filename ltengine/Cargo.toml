[package]
name = "ltengine"
version = "0.2.1"
edition = "2024"

[dependencies]
actix-web = "4"
clap = { version = "4.5.37", features = ["derive"] }
once_cell = "1.21.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
actix-web-static-files = "4.1.1"
static-files = "0.2.5"
hf-hub = { version = "0.5.0" }
anyhow = "1.0.97"
llama-cpp-bindings = { git = "https://github.com/intentee/llama-cpp-bindings", tag = "v0.9.0" }
encoding_rs = "0.8.35"
actix-multipart = "0.7.2"
whatlang = "0.18.0"
[features]
cuda = ["llama-cpp-bindings/cuda"]
metal = ["llama-cpp-bindings/metal"]
vulkan = ["llama-cpp-bindings/vulkan"]

[build-dependencies]
static-files = "0.2.5"
time = { version = "0.3", features = ["formatting"] }
