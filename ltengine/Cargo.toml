[package]
name = "ltengine"
version = "0.3.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-web-prom = "0.10.0"
clap = { version = "4.5.37", features = ["derive", "env"] }
once_cell = "1.21.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
actix-web-static-files = "4.1.1"
static-files = "0.2.5"
anyhow = "1.0.97"
thiserror = "2"
actix-multipart = "0.7.2"
whatlang = "0.18.0"

# Local inference (default)
hf-hub = { version = "0.5.0", optional = true }
llama-cpp-2 = { version = "0.1.150", optional = true }
encoding_rs = { version = "0.8.35", optional = true }
parking_lot = { version = "0.12", optional = true }

# API inference
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"], optional = true }
async-stream = { version = "0.3", optional = true }
tokio = { version = "1", features = ["macros", "time"], optional = true }

[features]
default = ["local"]
local = ["dep:llama-cpp-2", "dep:hf-hub", "dep:encoding_rs", "dep:parking_lot"]
api = ["dep:reqwest", "dep:async-stream", "dep:tokio"]
cuda = ["local", "llama-cpp-2/cuda"]
metal = ["local", "llama-cpp-2/metal"]
vulkan = ["local", "llama-cpp-2/vulkan"]

[build-dependencies]
static-files = "0.2.5"
time = { version = "0.3", features = ["formatting"] }
